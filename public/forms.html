<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netlify Form Detection Decoy</title>
</head>
<body>
    <!-- This is a decoy form for Netlify to detect during build. It is not shown to users. -->
    <form name="contact" netlify netlify-honeypot="bot-field" action="/success" hidden>
        <input type="text" name="name" />
        <input type="email" name="email" />
        <textarea name="message"></textarea>
    </form>
</body>
</html>
